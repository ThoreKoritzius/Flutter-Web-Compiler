name: flutter_dom_compiler
description: Experimental compiler for static Flutter widgets and lazy Flutter web islands.
version: 0.1.0
publish_to: none
repository: https://github.com/ThoreKoritzius/Flutter-Web-Compiler
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  analyzer: 7.7.1
  args: ^2.7.0
  crypto: ^3.0.7
  material_color_utilities: 0.13.0
  meta: ^1.17.0
  riverpod: 2.6.1
  path: ^1.9.1
  vector_math: 2.2.0
  yaml: ^3.1.3
dev_dependencies:
  html: ^0.15.7
  test: ^1.25.15
executables:
  flutter_dom: flutter_dom
