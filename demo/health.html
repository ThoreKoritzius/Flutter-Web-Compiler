<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health · Renderer comparison</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101116;color:#ebedf7;font:13px system-ui,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #30323a;gap:12px;flex-wrap:wrap}a{color:#b7c5ff;text-decoration:none}.switch{display:flex;gap:4px}button{padding:10px 16px;background:#242630;color:#b8bed0;border:0;border-radius:8px;cursor:pointer}button[aria-pressed=true]{background:#aabafa;color:#171b2b}p{margin:0;padding:12px 24px;color:#969fb3;font-size:12px}iframe{border:0;width:100%;height:calc(100vh - 116px);display:block}button:focus-visible,a:focus-visible{outline:2px solid white;outline-offset:3px}</style></head><body>
<header><a href="../">← Demos</a><strong>Health / mock data</strong><div class="switch"><button data-target="native" aria-pressed="true">Native SVG</button><button data-target="flutter" aria-pressed="false">Flutter CanvasKit</button></div><a id="direct" href="native/" target="_blank" rel="noopener">Open target ↗</a></header>
<p id="note">Explicit chart adapter → SVG. Shared Dart values; CustomPainter is not translated.</p>
<iframe id="preview" src="native/" title="Native health dashboard"></iframe>
<script>for(const button of document.querySelectorAll('button[data-target]'))button.addEventListener('click',()=>{const target=button.dataset.target;for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b===button));const frame=document.getElementById('preview');frame.src=target+'/';frame.title=target==='native'?'Native health dashboard':'Flutter health dashboard';document.getElementById('direct').href=target+'/';document.getElementById('note').textContent=target==='native'?'Explicit chart adapter → SVG. Shared Dart values; CustomPainter is not translated.':'Standard Flutter build → CustomPainter. Same Dart widgets and mock values; layout and chart presentation differ.';});</script></body></html>
