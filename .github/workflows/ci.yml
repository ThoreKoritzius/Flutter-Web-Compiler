name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.4
      - run: dart pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed bin lib test tool
      - run: dart analyze
      - run: dart test
      - run: dart run tool/logic_demo.dart --no-serve
      - run: dart run tool/logic_demo.dart --native-app --no-serve

  flutter-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: dart pub get --enforce-lockfile
      - run: flutter pub get
        working-directory: examples/catalog
      - run: flutter analyze
        working-directory: examples/catalog
      - run: dart run bin/flutter_dom.dart build --project examples/catalog --output build/demo
      - run: flutter pub get --enforce-lockfile
        working-directory: examples/multifile
      - run: flutter analyze
        working-directory: examples/multifile
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --resolve-imports --dom-only --output build/multifile
      - run: dart run bin/flutter_dom.dart inspect --project examples/multifile --resolve-imports --output build/multifile-inspection.json
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --source lib/sample_stat.dart --config flutter_dom.preview.json --resolve-imports --dom-only --output build/component-preview
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --source lib/period_selector.dart --config flutter_dom.state.json --resolve-imports --dom-only --output build/reactive-demo
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --source lib/info_panel.dart --config flutter_dom.composed.json --resolve-imports --dom-only --output build/composed-preview
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --source lib/record_list.dart --config flutter_dom.records.json --resolve-imports --dom-only --output build/record-list
      - run: dart run bin/flutter_dom.dart build --project examples/multifile --source lib/summary_panel.dart --config flutter_dom.summary.json --resolve-imports --dom-only --output build/summary-panel
      - run: dart run tool/check_health_geometry.dart
      - run: dart run tool/showcase.dart --no-serve
      - run: dart run bin/flutter_dom.dart build --project examples/health --resolve-imports --dom-only --output build/resolved-health
      - run: flutter pub get
        working-directory: examples/records_panel
      - run: flutter analyze
        working-directory: examples/records_panel
      - run: dart run bin/flutter_dom.dart build web --project examples/records_panel --dart-runtime --output build/records-panel
      - run: test -f build/records-panel/assets/fonts/MaterialIcons-Regular.otf
